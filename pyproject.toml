[project]
name = "dktxgnn"
version = "0.1.0"
description = "Denmark Drug Repurposing Predictions using TxGNN Knowledge Graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "openpyxl>=3.0.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dktxgnn"]
